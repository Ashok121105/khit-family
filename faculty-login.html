<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHIT Family | Faculty Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eff6ff, #ffffff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-box {
            width: 100%;
            max-width: 430px;
            background: white;
            border: 1px solid #dbeafe;
            border-radius: 16px;
            box-shadow: 0 18px 40px rgba(17, 24, 39, 0.08);
            padding: 30px 28px;
        }
        .brand { text-align: center; margin-bottom: 22px; }
        .brand-badge {
            width: 72px; height: 72px; margin: 0 auto 12px; border-radius: 18px; background: #8f1738;
            color: white; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700;
        }
        h1 { color: #8f1738; font-size: 28px; margin-bottom: 6px; }
        .subtitle { color: #64748b; font-size: 13px; margin-bottom: 24px; text-align: center; }
        .field { margin-bottom: 18px; }
        label { display: block; margin-bottom: 7px; color: #374151; font-size: 14px; font-weight: 600; }
        input {
            width: 100%; padding: 12px 13px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; outline: none;
        }
        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 48px; }
        .mouth-toggle {
            position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
            width: 34px; height: 34px; border: 0; border-radius: 50%;
            background: #f8e8ed; color: #8f1738; cursor: pointer;
            display: flex; align-items: center; justify-content: center; padding: 0;
            font-size: 18px; line-height: 1; font-family: "Segoe UI Emoji", sans-serif;
        }
        .mouth-toggle:hover, .mouth-toggle:focus-visible { background: #f4ccd7; outline: 2px solid rgba(143,23,56,0.25); }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.08); }
        .login-btn {
            width: 100%; border: none; background: #8f1738; color: white; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer;
        }
        .login-btn:disabled { background: #9ca3af; cursor: not-allowed; }
        .message {
            display: none; margin-top: 18px; padding: 12px; border-radius: 8px; font-size: 13px; text-align: center;
        }
        .success { display: block; background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
        .error { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .meta-links { text-align: center; margin-top: 18px; font-size: 13px; color: #64748b; }
        .meta-links button { border: none; background: none; color: #2563eb; font-weight: 600; cursor: pointer; }
    </style>
    <link rel='stylesheet' href='premium-theme.css'>
</head>
<body>
    <div class="login-box">
        <div class="brand">
            <div class="brand-badge">K</div>
            <h1>Faculty Login</h1>
        </div>
        <p class="subtitle">Access the KHIT Family faculty portal</p>

        <div class="field">
            <label for="username">Username</label>
            <input id="username" type="text" placeholder="Enter faculty username" autocomplete="username">
        </div>

        <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
                <input id="password" type="password" placeholder="Enter faculty password" autocomplete="current-password">
                <button class="mouth-toggle" type="button" onclick="togglePasswordVisibility('password', this)" aria-label="Show password" title="Show password">🙈</button>
            </div>
        </div>

        <button class="login-btn" id="loginBtn" onclick="facultyLogin()">Login</button>

        <div id="message" class="message"></div>

        <div class="meta-links">
            <p>Need the demo details? <button type="button" onclick="showDemoCredentials()">View credentials</button></p>
            <p style="margin-top:10px;"><button type="button" onclick="window.location.href='index.html'">Back to home</button></p>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:5000";

        function togglePasswordVisibility(inputId, button) {
            const input = document.getElementById(inputId);
            const isVisible = input.type === "text";
            input.type = isVisible ? "password" : "text";
            button.textContent = isVisible ? "🙈" : "👀";
            button.setAttribute("aria-label", isVisible ? "Show password" : "Hide password");
            button.setAttribute("title", isVisible ? "Show password" : "Hide password");
        }

        async function facultyLogin() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            const button = document.getElementById("loginBtn");
            const message = document.getElementById("message");

            message.className = "message";
            message.textContent = "";

            if (!username || !password) {
                message.textContent = "Please enter username and password.";
                message.className = "message error";
                return;
            }

            button.disabled = true;
            button.textContent = "Logging in...";

            try {
                const response = await fetch(`${API_URL}/api/faculty/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || "Faculty login failed");
                }

                localStorage.setItem("khit_token", result.token);
                localStorage.setItem("khit_user", JSON.stringify(result.user));
                localStorage.setItem("khit_faculty", JSON.stringify(result.faculty));

                message.textContent = "Faculty login successful. Opening dashboard...";
                message.className = "message success";

                setTimeout(() => {
                    window.location.href = "faculty-dashboard.html";
                }, 700);
            } catch (error) {
                message.textContent = error.message || "Unable to login.";
                message.className = "message error";
            } finally {
                button.disabled = false;
                button.textContent = "Login";
            }
        }

        async function showDemoCredentials() {
            try {
                const response = await fetch(`${API_URL}/api/demo-credentials`);
                const result = await response.json();
                if (!response.ok || result.status !== "success") {
                    throw new Error(result.message || "Unable to fetch demo credentials");
                }
                const faculty = result.demoAccounts?.faculty;
                if (!faculty?.username || !faculty?.password) {
                    throw new Error("Faculty demo credentials are unavailable.");
                }
                alert(`Faculty Demo Credentials:\n\nUsername: ${faculty.username}\nPassword: ${faculty.password}`);
            } catch (error) {
                alert(error.message || "Unable to fetch demo credentials");
            }
        }
    </script>
</body>
</html>
