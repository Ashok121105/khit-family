<!DOCTYPE html>
<html lang="en">
<head>
<script src="api-config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave Request | KHIT Family</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.topbar{height:70px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.brand{font-size:22px;font-weight:700;color:#173b70}.actions{display:flex;gap:10px}.btn{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600}.dashboard{background:#eef4ff;color:#173b70}.logout{background:#173b70;color:#fff}.container{max-width:1100px;margin:auto;padding:30px}.hero{background:#173b70;color:#fff;border-radius:16px;padding:30px;margin-bottom:22px}.hero h1{margin:0 0 8px}.hero p{margin:0;color:#f7e8eb}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px;margin-bottom:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:13px;color:#64748b}.form input,.form textarea{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid #dbe1ea;border-radius:7px;font:inherit}.form textarea{min-height:110px;grid-column:span 2}.form .submit{grid-column:span 2;background:#8f1738;color:#fff}.message{margin-top:14px;color:#166534}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f4;font-size:13px}th{color:#64748b;font-size:12px;text-transform:uppercase}.status{font-weight:600;color:#92400e}@media(max-width:700px){.topbar{padding:0 18px}.container{padding:18px}.form{grid-template-columns:1fr}.form textarea,.form .submit{grid-column:auto}.actions .dashboard{display:none}}
</style>
    <link rel='stylesheet' href='premium-theme.css'>
</head>
<body>
<header class="topbar"><div class="brand">KHIT Family</div><div class="actions"><button class="btn dashboard" onclick="goDashboard()">Dashboard</button><button class="btn logout" onclick="logout()">Logout</button></div></header>
<main class="container"><section class="hero"><h1>Leave Request</h1><p>Submit a leave request and track its approval status.</p></section><section class="panel"><h2>Apply Leave</h2><form class="form" onsubmit="submitLeave(event)"><label>Start date<input id="startsOn" type="date" required></label><label>End date<input id="endsOn" type="date" required></label><label style="grid-column:span 2">Reason<textarea id="reason" required placeholder="Enter the reason for leave"></textarea></label><button class="btn submit" type="submit">Submit Request</button></form><p class="message" id="message"></p></section><section class="panel"><h2>My Requests</h2><div class="table-wrap"><table><thead><tr><th>Start</th><th>End</th><th>Reason</th><th>Status</th><th>Submitted</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading...</td></tr></tbody></table></div></section></main>
<script>
const token=localStorage.getItem("khit_token");if(!token)location.href="login.html";function goDashboard(){location.href="student-dashboard.html"}function logout(){localStorage.removeItem("khit_token");localStorage.removeItem("khit_user");localStorage.removeItem("khit_student");location.href="login.html"}function escapeHTML(value){return String(value??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;","'":"&#039;"}[c]))}async function loadRequests(){const response=await fetch("/api/student/leave-requests",{headers:{Authorization:`Bearer ${token}`}});if(!response.ok)return;const data=await response.json();const rows=data.requests||[];document.getElementById("rows").innerHTML=rows.length?rows.map(item=>`<tr><td>${escapeHTML(item.starts_on)}</td><td>${escapeHTML(item.ends_on)}</td><td>${escapeHTML(item.reason)}</td><td class="status">${escapeHTML(item.status)}</td><td>${escapeHTML(item.created_at)}</td></tr>`).join(""):"<tr><td colspan='5'>No leave requests submitted.</td></tr>"}async function submitLeave(event){event.preventDefault();const response=await fetch("/api/student/leave-requests",{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`},body:JSON.stringify({starts_on:startsOn.value,ends_on:endsOn.value,reason:reason.value})});const data=await response.json();const message=document.getElementById("message");message.textContent=data.message||"Request submitted";if(response.ok){event.target.reset();loadRequests()}}loadRequests();
</script>
</body>
</html>
