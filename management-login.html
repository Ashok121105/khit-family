<!doctype html>
<html lang="en">
<head>
  <script src="language.js"></script>
  <script src="api-config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Management Login | KHIT Family</title>
  <link rel="stylesheet" href="premium-theme.css">
  <style>
    :root { --ink:#30252a; --muted:#75686d; --accent:#8f1738; --accent-dark:#5e1029; --rose:#f7e8eb; --line:#eadde0; --paper:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 12% 8%,rgba(247,232,235,.9),transparent 30%),linear-gradient(145deg,#fbf8f5,#fff); font-family:Arial,sans-serif; display:grid; place-items:center; padding:24px; }
    .shell { width:min(500px,100%); background:rgba(255,255,255,.96); border:1px solid var(--line); border-radius:18px; box-shadow:0 24px 70px rgba(95,16,41,.14); padding:38px 42px 30px; }
    .brand-lockup { display:flex; align-items:center; gap:12px; margin-bottom:26px; }
    .brand-mark { width:42px; height:42px; display:grid; place-items:center; border-radius:12px; background:linear-gradient(145deg,var(--accent-dark),var(--accent)); color:#fff; font:800 18px Arial,sans-serif; box-shadow:0 8px 18px rgba(95,16,41,.2); }
    .brand-name { color:var(--accent); font:800 13px Arial,sans-serif; letter-spacing:.16em; text-transform:uppercase; }
    .brand-caption { margin-top:4px; color:var(--muted); font:12px Arial,sans-serif; }
    .eyebrow { color:var(--accent); font:700 12px/1.2 Arial,sans-serif; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0 0 10px; color:var(--accent-dark); font:700 clamp(32px,7vw,40px)/1 Georgia,"Times New Roman",serif; letter-spacing:0; }
    .intro { max-width:390px; color:var(--muted); margin:0 0 28px; font:14px/1.65 Arial,sans-serif; }
    .field { margin-top:17px; }
    label { display:flex; align-items:center; gap:7px; margin:0 0 8px; color:var(--ink); font:700 12px Arial,sans-serif; letter-spacing:.02em; }
    label::after { content:""; width:5px; height:5px; border-radius:50%; background:var(--accent); }
    input,select { width:100%; border:1px solid #d9cbd0; border-radius:9px; background:#fff; padding:13px 14px; font:15px Arial,sans-serif; color:var(--ink); transition:border-color .18s ease,box-shadow .18s ease; }
    input:focus,select:focus { border-color:var(--accent); box-shadow:0 0 0 4px rgba(143,23,56,.1); outline:none; }
    .role-note { margin:10px 0 0; color:var(--muted); font:12px/1.5 Arial,sans-serif; }
    button { width:100%; margin-top:28px; border:0; border-radius:9px; background:linear-gradient(135deg,var(--accent-dark),var(--accent)) !important; color:#fff; padding:14px 16px; font:700 14px Arial,sans-serif; cursor:pointer; box-shadow:0 12px 24px rgba(95,16,41,.18); transition:transform .18s ease,box-shadow .18s ease,filter .18s ease; }
    button:hover { filter:brightness(1.06); transform:translateY(-1px); box-shadow:0 15px 28px rgba(95,16,41,.24); }
    button:disabled { opacity:.6; cursor:wait; }
    .message { min-height:24px; margin-top:16px; font:13px/1.5 Arial,sans-serif; }
    .error { color:#b42318; } .success { color:#16704a; }
    .links { display:flex; justify-content:space-between; gap:12px; margin-top:24px; padding-top:20px; border-top:1px solid var(--line); font:13px Arial,sans-serif; }
    a { color:var(--accent); text-decoration:none; font-weight:700; }
    a:hover { color:var(--accent-dark); text-decoration:underline; text-underline-offset:3px; }
    @media(max-width:520px) { body { padding:14px; } .shell { padding:28px 22px 24px; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand-lockup"><div class="brand-mark">K</div><div><div class="brand-name">KHIT Family</div><div class="brand-caption">Management workspace</div></div></div>
    <h1>Management portal</h1>
    <p class="intro">Sign in once. Your role, permissions, and department scope determine the dashboard.</p>
    <form id="loginForm">
      <div class="field"><label for="role">Role</label>
      <select id="role">
        <option value="hod">HOD</option>
        <option value="associate_hod">Associate HOD</option>
        <option value="assistant_hod">Assistant HOD</option>
        <option value="ao">AO</option>
        <option value="principal">Principal</option>
        <option value="director">Director</option>
        <option value="admin">Admin</option>
        <option value="superadmin">Super Admin</option>
      </select><p class="role-note">Choose the role assigned to your account.</p></div>
      <div class="field"><label for="username">Username</label>
      <input id="username" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required></div>
      <button id="loginButton" type="submit">Sign in</button>
    </form>
    <div id="message" class="message" role="status"></div>
    <div class="links"><a href="index.html">Back to portal</a><a href="database/admin-login.html">Admin login</a></div>
  </main>
  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const role = document.getElementById("role").value;
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const adminRole = role === "admin" || role === "superadmin";
      button.disabled = true;
      message.className = "message";
      message.textContent = "Signing in...";
      try {
        const response = await fetch(adminRole ? "/api/admin/login" : "/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(adminRole ? { username, password } : { username, password, role })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || "Management login failed");
        localStorage.setItem("khit_token", result.token);
        localStorage.setItem("khit_user", JSON.stringify(result.user || {}));
        window.location.href = "management-dashboard.html";
      } catch (error) {
        message.className = "message error";
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
<script src="khit-ai.js"></script>
</body>
</html>
