<!doctype html>
<html lang="en">
<head>
  <script src="language.js"></script>
  <script src="api-config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Management Login | KHIT Family</title>
  <link rel="stylesheet" href="premium-theme.css">
  <style>
    :root { --ink:#14213d; --muted:#62708a; --accent:#b4234d; --line:#e5e7eb; --paper:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:linear-gradient(135deg,#f5f7fb,#fff7f2); font-family:Georgia,"Times New Roman",serif; display:grid; place-items:center; padding:24px; }
    .shell { width:min(460px,100%); background:var(--paper); border:1px solid var(--line); box-shadow:0 24px 70px rgba(20,33,61,.12); padding:38px; }
    .eyebrow { color:var(--accent); font:700 12px/1.2 Arial,sans-serif; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:10px 0 8px; font-size:36px; line-height:1; }
    .intro { color:var(--muted); margin:0 0 26px; font:15px/1.6 Arial,sans-serif; }
    label { display:block; margin:18px 0 7px; font:700 13px Arial,sans-serif; }
    input,select { width:100%; border:1px solid #cbd5e1; background:#fff; padding:13px 14px; font:15px Arial,sans-serif; color:var(--ink); }
    button { width:100%; margin-top:24px; border:0; background:var(--accent); color:#fff; padding:14px 16px; font:700 14px Arial,sans-serif; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .message { min-height:24px; margin-top:16px; font:14px/1.5 Arial,sans-serif; }
    .error { color:#b42318; } .success { color:#16704a; }
    .links { display:flex; justify-content:space-between; gap:12px; margin-top:24px; font:13px Arial,sans-serif; }
    a { color:var(--accent); text-decoration:none; }
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">KHIT Family</div>
    <h1>Management portal</h1>
    <p class="intro">Sign in once. Your role, permissions, and department scope determine the dashboard.</p>
    <form id="loginForm">
      <label for="role">Role</label>
      <select id="role">
        <option value="hod">HOD</option>
        <option value="associate_hod">Associate HOD</option>
        <option value="assistant_hod">Assistant HOD</option>
        <option value="ao">AO</option>
        <option value="principal">Principal</option>
        <option value="director">Director</option>
        <option value="admin">Admin</option>
        <option value="superadmin">Super Admin</option>
      </select>
      <label for="username">Username</label>
      <input id="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="loginButton" type="submit">Sign in</button>
    </form>
    <div id="message" class="message" role="status"></div>
    <div class="links"><a href="index.html">Back to portal</a><a href="database/admin-login.html">Admin login</a></div>
  </main>
  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const role = document.getElementById("role").value;
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const adminRole = role === "admin" || role === "superadmin";
      button.disabled = true;
      message.className = "message";
      message.textContent = "Signing in...";
      try {
        const response = await fetch(adminRole ? "/api/admin/login" : "/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(adminRole ? { username, password } : { username, password, role })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || "Management login failed");
        localStorage.setItem("khit_token", result.token);
        localStorage.setItem("khit_user", JSON.stringify(result.user || {}));
        window.location.href = "management-dashboard.html";
      } catch (error) {
        message.className = "message error";
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
<script src="khit-ai.js"></script>
</body>
</html>
