<!DOCTYPE html>
<script src="api-config.js"></script>
<html lang="en"><head><script src="language.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Documents Management | KHIT Family</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.topbar{height:70px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.brand{font-size:22px;font-weight:700;color:#173b70}.actions{display:flex;gap:10px}.btn{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600}.dashboard{background:#eef4ff;color:#173b70}.logout{background:#173b70;color:#fff}.container{max-width:1250px;margin:auto;padding:30px}.hero{background:#173b70;color:#fff;border-radius:16px;padding:30px;margin-bottom:22px}.hero h1{margin:0 0 8px}.hero p{margin:0;color:#f7e8eb}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px;margin-bottom:20px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.form input,.form select{padding:11px;border:1px solid #dbe1ea;border-radius:7px}.form .submit{background:#8f1738;color:#fff}.message{margin-top:14px;color:#166534}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:750px}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f4;font-size:13px}th{color:#64748b;font-size:12px;text-transform:uppercase}a{color:#8f1738}@media(max-width:800px){.topbar{padding:0 18px}.container{padding:18px}.form{grid-template-columns:1fr}.actions .dashboard{display:none}}
</style>    <link rel='stylesheet' href='premium-theme.css'>
</head><body><header class="topbar"><div class="brand">KHIT Family | Documents</div><div class="actions"><button class="btn dashboard" onclick="goDashboard()">Admin Dashboard</button><button class="btn logout" onclick="logout()">Logout</button></div></header><main class="container"><section class="hero"><h1>Official Documents</h1><p>Upload approved certificates, receipts, circulars, and academic documents.</p></section><section class="panel"><h2>Upload Document</h2><form class="form" onsubmit="uploadDocument(event)"><input id="documentName" required placeholder="Document name"><select id="documentType"><option>Certificate</option><option>Fee Receipt</option><option>Academic</option><option>Hall Ticket</option><option>Circular</option><option>Other</option></select><input id="userId" type="number" min="1" placeholder="Recipient user ID (optional)"><input id="file" type="file" required accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.csv,.png,.jpg,.jpeg,.webp,.mp4"><button class="btn submit" type="submit">Upload</button></form><p class="message" id="message"></p></section><section class="panel"><h2>Uploaded Documents</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Type</th><th>Recipient</th><th>Uploaded</th><th>File</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading...</td></tr></tbody></table></div></section></main><script>
const token=localStorage.getItem("khit_token");if(!token)location.href="database/admin-login.html";function goDashboard(){location.href="admin-dashboard.html"}function logout(){localStorage.removeItem("khit_token");localStorage.removeItem("khit_user");location.href="database/admin-login.html"}function escapeHTML(value){return String(value??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;","'":"&#039;"}[c]))}async function loadDocuments(){const response=await fetch("/api/admin/documents",{headers:{Authorization:`Bearer ${token}`}});if(response.status===401||response.status===403)return logout();const data=await response.json();const documents=data.documents||[];document.getElementById("rows").innerHTML=documents.length?documents.map(item=>`<tr><td>${escapeHTML(item.document_name)}</td><td>${escapeHTML(item.document_type||"-")}</td><td>${escapeHTML(item.username||"All authorized users")}</td><td>${escapeHTML(item.uploaded_at)}</td><td><a href="${item.file_url}" target="_blank" rel="noopener">Open</a></td></tr>`).join(""):"<tr><td colspan='5'>No documents uploaded.</td></tr>"}async function uploadDocument(event){event.preventDefault();const form=new FormData();form.append("document_name",documentName.value);form.append("document_type",documentType.value);if(userId.value)form.append("user_id",userId.value);form.append("file",file.files[0]);const response=await fetch("/api/admin/documents",{method:"POST",headers:{Authorization:`Bearer ${token}`},body:form});const data=await response.json();document.getElementById("message").textContent=data.message||"Upload failed";if(response.ok){event.target.reset();loadDocuments()}}loadDocuments();
</script></body></html>
