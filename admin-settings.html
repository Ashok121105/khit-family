<!DOCTYPE html>
<html lang="en">
<head>
<script src="language.js"></script>
<script src="api-config.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | KHIT Family</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #172033; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .shell { display: flex; min-height: 100vh; }
    .side { width: 240px; background: #101827; color: #fff; padding: 24px 16px; position: fixed; inset: 0 auto 0 0; }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand h1 { font-size: 20px; letter-spacing: 2px; margin: 0; }
    .brand p { font-size: 11px; color: #9ca8bb; }
    .nav a { display: block; color: #cbd5e1; text-decoration: none; padding: 11px 13px; border-radius: 8px; margin: 4px 0; font-size: 14px; }
    .nav a:hover, .nav a.active { background: #1d4ed8; color: #fff; }
    .logout { width: 100%; margin-top: 24px; padding: 11px; background: #dc2626; color: #fff; border: 0; border-radius: 7px; cursor: pointer; }
    .main { margin-left: 240px; width: calc(100% - 240px); }
    header { height: 70px; background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 30px; display: flex; align-items: center; justify-content: space-between; }
    header h2 { margin: 0; font-size: 20px; }
    .user { color: #64748b; font-size: 13px; }
    .content { padding: 30px; max-width: 900px; }
    .hero { background: #172554; color: #fff; padding: 26px; border-radius: 14px; margin-bottom: 22px; }
    .hero h1 { margin: 0 0 8px; }
    .hero p { margin: 0; color: #dbeafe; }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 22px; margin-bottom: 20px; box-shadow: 0 5px 20px rgba(15, 23, 42, 0.06); }
    .setting { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #edf0f4; }
    .setting:last-child { border-bottom: 0; }
    .setting span { color: #64748b; font-size: 13px; }
    .switch { width: 42px; height: 22px; accent-color: #1d4ed8; }
    @media (max-width: 760px) {
      .side { position: static; width: 100%; height: auto; }
      .shell { display: block; }
      .main { margin-left: 0; width: 100%; }
      header { padding: 0 18px; }
      .content { padding: 18px; }
      .user { display: none; }
    }
  </style>
    <link rel='stylesheet' href='premium-theme.css'>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <h1>KHIT FAMILY</h1>
        <p>College Management Portal</p>
      </div>
      <nav class="nav">
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-students.html">Students</a>
        <a href="admin-faculty.html">Faculty</a>
        <a href="admin-fees.html">Fees</a>
        <a href="admin-bus.html">Bus</a>
        <a href="database/admin-notifications.html">Notifications</a>
        <a href="admin-events.html">Events</a>
        <a class="active" href="admin-settings.html">Settings</a>
      </nav>
      <button class="logout" onclick="logout()">Logout</button>
    </aside>

    <main class="main">
      <header>
        <h2>Portal Settings</h2>
        <span class="user" id="userInfo">Authorized administrator</span>
      </header>

      <section class="content">
        <div class="hero">
          <h1>System Settings</h1>
          <p>Configure portal behavior after technical and college approvals are recorded.</p>
        </div>

        <div class="panel">
          <div id="settingsList"></div>
          <div style="margin-top:20px; display:flex; justify-content:flex-end;">
            <button id="saveSettingsBtn" class="primary-btn" style="padding:10px 18px; border:0; background:#1d4ed8; color:#fff; border-radius:8px; cursor:pointer;">Save settings</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const token = localStorage.getItem('khit_token');
    if (!token) {
      location.href = 'database/admin-login.html';
    }

    const user = JSON.parse(localStorage.getItem('khit_user') || '{}');
    document.getElementById('userInfo').textContent = user.username || 'Authorized administrator';

    const settingsMeta = [
      { key: 'demo_data_mode', label: 'Demo data mode', description: 'Keep unofficial records clearly marked as sample data.' },
      { key: 'public_registration', label: 'Public registration', description: 'Allow public self-registration without admin approval.' },
      { key: 'payment_gateway', label: 'Payment gateway', description: 'Enable external payment processing.' },
      { key: 'registration_approval', label: 'Registration approval', description: 'Require admin approval before new registrations are activated.' },
      { key: 'email_notifications', label: 'Email notifications', description: 'Send portal email notifications for updates.' }
    ];

    const settingsList = document.getElementById('settingsList');

    function buildSettingsUI(settings) {
      settingsList.innerHTML = settingsMeta.map((item) => `
        <div class="setting">
          <div>
            <strong>${item.label}</strong><br>
            <span>${item.description}</span>
          </div>
          <input class="switch" type="checkbox" data-key="${item.key}" ${settings[item.key] ? 'checked' : ''}>
        </div>
      `).join('');
    }

    async function loadSettings() {
      try {
        const response = await fetch('/api/admin/settings', {
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          }
        });

        const data = await response.json();
        if (!response.ok || data.status !== 'success') {
          throw new Error(data.message || 'Failed to load settings');
        }

        buildSettingsUI(data.settings || {});
      } catch (error) {
        settingsList.innerHTML = '<p style="color:#b91c1c;">Unable to load settings. Please try again.</p>';
        console.error(error);
      }
    }

    async function saveSettings() {
      const checkboxes = [...document.querySelectorAll('[data-key]')];
      const payload = {};

      checkboxes.forEach((checkbox) => {
        payload[checkbox.dataset.key] = checkbox.checked;
      });

      try {
        const response = await fetch('/api/admin/settings', {
          method: 'PUT',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok || data.status !== 'success') {
          throw new Error(data.message || 'Failed to save settings');
        }

        alert('Settings saved successfully');
      } catch (error) {
        alert(error.message || 'Unable to save settings');
        console.error(error);
      }
    }

    document.getElementById('saveSettingsBtn').addEventListener('click', saveSettings);
    loadSettings();

    function logout() {
      localStorage.removeItem('khit_token');
      localStorage.removeItem('khit_user');
      location.href = 'database/admin-login.html';
    }
  </script>
</body>
</html>
