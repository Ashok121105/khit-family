<!DOCTYPE html>
<script src="api-config.js"></script>
<html lang="en"><head><script src="language.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Leave Requests | KHIT Family</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.topbar{height:70px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.brand{font-size:22px;font-weight:700;color:#173b70}.actions{display:flex;gap:10px}.btn{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600}.dashboard{background:#eef4ff;color:#173b70}.logout{background:#173b70;color:#fff}.container{max-width:1250px;margin:auto;padding:30px}.hero{background:#173b70;color:#fff;border-radius:16px;padding:30px;margin-bottom:22px}.hero h1{margin:0 0 8px}.hero p{margin:0;color:#f7e8eb}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f4;font-size:13px}th{color:#64748b;font-size:12px;text-transform:uppercase}.btn.approve{background:#15803d;color:#fff}.btn.reject{background:#dc2626;color:#fff}.btn.clarify{background:#d97706;color:#fff}.status{font-weight:600;color:#92400e}@media(max-width:700px){.topbar{padding:0 18px}.container{padding:18px}.actions .dashboard{display:none}}
</style>    <link rel='stylesheet' href='premium-theme.css'>
</head><body><header class="topbar"><div class="brand">KHIT Family | Leave Review</div><div class="actions"><button class="btn dashboard" onclick="goDashboard()">Admin Dashboard</button><button class="btn logout" onclick="logout()">Logout</button></div></header><main class="container"><section class="hero"><h1>Leave Requests</h1><p>Review and respond to student leave requests according to authorized college policy.</p></section><section class="panel"><div class="table-wrap"><table><thead><tr><th>Student</th><th>Student ID</th><th>Dates</th><th>Reason</th><th>Status</th><th>Review</th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading...</td></tr></tbody></table></div></section></main><script>
const token=localStorage.getItem("khit_token");if(!token)location.href="database/admin-login.html";function goDashboard(){location.href="admin-dashboard.html"}function logout(){localStorage.removeItem("khit_token");localStorage.removeItem("khit_user");location.href="database/admin-login.html"}function escapeHTML(value){return String(value??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;","'":"&#039;"}[c]))}async function loadRequests(){const response=await fetch("/api/admin/leave-requests",{headers:{Authorization:`Bearer ${token}`}});if(response.status===401||response.status===403)return logout();const data=await response.json();const rows=data.requests||[];document.getElementById("rows").innerHTML=rows.length?rows.map(item=>`<tr><td>${escapeHTML(item.full_name||"-")}</td><td>${escapeHTML(item.student_code||"-")}</td><td>${escapeHTML(item.from_date||"-")} to ${escapeHTML(item.to_date||"-")}</td><td>${escapeHTML(item.reason||"-")}</td><td class="status">${escapeHTML(item.status||"Pending")}</td><td><button class="btn approve" onclick="review(${item.id},'Approved')">Approve</button> <button class="btn reject" onclick="review(${item.id},'Rejected')">Reject</button> <button class="btn clarify" onclick="review(${item.id},'Clarification')">Clarify</button></td></tr>`).join(""):"<tr><td colspan='6'>No leave requests.</td></tr>"}async function review(id,status){const response=await fetch(`/api/admin/leave-requests/${id}/review`,{method:"PATCH",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`},body:JSON.stringify({status})});const data=await response.json();if(!response.ok)return alert(data.message||"Unable to review request");loadRequests()}loadRequests();
</script></body></html>
